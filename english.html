<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Quiz - DC Office Preparation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: #fff; width: 95%; max-width: 650px; padding: 25px; border-radius: 15px; box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
        h2 { color: #2980b9; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 15px; }
        .question { font-size: 1.25rem; margin-bottom: 20px; font-weight: 600; color: #2c3e50; min-height: 50px; }
        .options { display: grid; gap: 12px; }
        .option-btn { padding: 14px; border: 2px solid #ecf0f1; border-radius: 10px; background: #f8f9fa; cursor: pointer; transition: 0.2s; text-align: left; font-size: 1.05rem; color: #34495e; }
        .option-btn:hover { background: #e2e6ea; border-color: #bdc3c7; }
        .correct { background-color: #27ae60 !important; color: white; border-color: #219150; }
        .wrong { background-color: #e74c3c !important; color: white; border-color: #c0392b; }
        .score-board { display: flex; justify-content: space-between; font-weight: bold; color: #7f8c8d; margin-bottom: 15px; background: #f1f2f6; padding: 10px; border-radius: 8px; }
        #next-btn { display: none; margin-top: 25px; width: 100%; padding: 15px; background: #2980b9; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
        #next-btn:hover { background: #2471a3; }
        #result-area { text-align: center; display: none; }
        .restart-btn { padding: 12px 25px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <div class="score-board">
        <span>Question: <span id="current-idx">1</span>/50</span>
        <span>Score: <span id="score">0</span></span>
    </div>
    <div id="quiz-content">
        <div class="question" id="question-text">Loading Questions...</div>
        <div class="options" id="options-container"></div>
        <button id="next-btn" onclick="loadNextQuestion()">Next Question →</button>
    </div>
    <div id="result-area">
        <h2>Quiz Completed!</h2>
        <p style="font-size: 1.8rem; color: #2c3e50;">Final Score: <span id="final-score">0</span> / 50</p>
        <button class="restart-btn" onclick="location.reload()">Try Again</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "1. Which one is a proper noun?", a: ["Team", "Dhaka", "Water", "Man"], c: 1 },
        { q: "2. He is ___ M.A. in English.", a: ["a", "an", "the", "no article"], c: 1 },
        { q: "3. What is the plural form of 'Ox'?", a: ["Oxes", "Oxen", "Oxens", "Oxs"], c: 1 },
        { q: "4. I have been living here ___ 2010.", a: ["for", "from", "since", "by"], c: 2 },
        { q: "5. Which one is the correct spelling?", a: ["Lieutenent", "Lieutenant", "Lieuetenant", "Lieutanant"], c: 1 },
        { q: "6. He is good ___ English.", a: ["at", "in", "on", "for"], c: 0 },
        { q: "7. The synonym of 'Remote' is -", a: ["Near", "Distant", "Fast", "Close"], c: 1 },
        { q: "8. He ___ to school every day.", a: ["go", "goes", "gone", "going"], c: 1 },
        { q: "9. What is the feminine gender of 'Tiger'?", a: ["Tigers", "Tigress", "Tigeress", "Tigre"], c: 1 },
        { q: "10. 'Better' is the comparative degree of -", a: ["Best", "Good", "Well", "Both B & C"], c: 3 },
        { q: "11. Identify the abstract noun:", a: ["Family", "Honesty", "Gold", "River"], c: 1 },
        { q: "12. I saw ___ one-eyed man.", a: ["a", "an", "the", "none"], c: 0 },
        { q: "13. 'A rolling stone gathers no moss.' Here 'rolling' is -", a: ["Gerund", "Participle", "Noun", "Verb"], c: 1 },
        { q: "14. What is the past participle of 'Do'?", a: ["Did", "Done", "Does", "Doing"], c: 1 },
        { q: "15. Which one is an Uncountable Noun?", a: ["Milk", "Book", "Pen", "Star"], c: 0 },
        { q: "16. Death is preferable ___ dishonor.", a: ["than", "to", "for", "from"], c: 1 },
        { q: "17. 'Call in a doctor.' The passive is -", a: ["A doctor is called.", "Let a doctor be called in.", "Let a doctor called.", "Doctor is called."], c: 1 },
        { q: "18. Look ___ the map.", a: ["to", "at", "on", "in"], c: 1 },
        { q: "19. If I ___ a bird, I would fly.", a: ["am", "was", "were", "been"], c: 2 },
        { q: "20. The antonym of 'Optimism' is -", a: ["Pessimism", "Hope", "Active", "Rich"], c: 0 },
        { q: "21. Choose the correct sentence:", a: ["He is more better.", "He is the best of the two.", "He is better than I.", "He is as better as I."], c: 2 },
        { q: "22. The noun form of the word 'Believe' is -", a: ["Belief", "Believable", "Believing", "Believes"], c: 0 },
        { q: "23. He died ___ accident.", a: ["by", "of", "from", "at"], c: 0 },
        { q: "24. 'Wait until I ___ back.'", a: ["will come", "come", "came", "coming"], c: 1 },
        { q: "25. Which one is a reflexive pronoun?", a: ["Me", "Himself", "They", "Whom"], c: 1 },
        { q: "26. Correct spelling of 'Achievement':", a: ["Achievment", "Achievement", "Achivment", "Aceivement"], c: 1 },
        { q: "27. One of the boys ___ absent.", a: ["are", "is", "were", "be"], c: 1 },
        { q: "28. 'Pen through the line.' Here 'Pen' is a -", a: ["Noun", "Verb", "Adverb", "Adjective"], c: 1 },
        { q: "29. The baby is crying ___ it is hungry.", a: ["so", "but", "because", "although"], c: 2 },
        { q: "30. What is the adjective of 'Circle'?", a: ["Circular", "Circulate", "Circum", "Circles"], c: 0 },
        { q: "31. Translate into English: 'সে সাঁতার জানে না।'", a: ["He does not swim.", "He does not know to swim.", "He does not know how to swim.", "He is not swimming."], c: 2 },
        { q: "32. Fill in: I have ___ money in my pocket.", a: ["few", "little", "many", "any"], c: 1 },
        { q: "33. 'By and by' means -", a: ["Directly", "Slowly", "Soon", "Never"], c: 2 },
        { q: "34. Who is the author of 'Hamlet'?", a: ["Milton", "Shakespeare", "Keats", "Pope"], c: 1 },
        { q: "35. 'Give up' means -", a: ["Start", "Stop/Abandon", "Continue", "Try"], c: 1 },
        { q: "36. 'Man is mortal.' What kind of sentence?", a: ["Assertive", "Interrogative", "Optative", "Exclamatory"], c: 0 },
        { q: "37. Plural of 'Datum' is -", a: ["Datums", "Data", "Datas", "Datumes"], c: 1 },
        { q: "38. 'Birds fly in the sky.' Here 'fly' is -", a: ["Transitive", "Intransitive", "Auxiliary", "Modal"], c: 1 },
        { q: "39. He is as white as ___.", a: ["Milk", "Snow", "Cloud", "Paper"], c: 1 },
        { q: "40. Choose the correct spelling:", a: ["Committee", "Comitte", "Comittee", "Commitee"], c: 0 },
        { q: "41. 'Black and Blue' means -", a: ["Colorful", "Mercilessly", "Quickly", "Painfully"], c: 1 },
        { q: "42. I am look forward to ___ you.", a: ["see", "seeing", "seen", "saw"], c: 1 },
        { q: "43. 'Virtue' is a/an -", a: ["Proper Noun", "Common Noun", "Abstract Noun", "Material Noun"], c: 2 },
        { q: "44. What is the synonym of 'Brief'?", a: ["Short", "Long", "Small", "Little"], c: 0 },
        { q: "45. He behaves ___ he were a king.", a: ["as", "as if", "though", "since"], c: 1 },
        { q: "46. Which is the superlative degree of 'Bad'?", a: ["Badder", "Baddest", "Worst", "Worse"], c: 2 },
        { q: "47. Rice sells 50 taka ___ kg.", a: ["a", "an", "the", "no article"], c: 0 },
        { q: "48. Translate: 'আজ বৃষ্টি হতে পারে।'", a: ["It may rain today.", "Today rain.", "It rains today.", "It can rain today."], c: 0 },
        { q: "49. He is ___ honest man.", a: ["a", "an", "the", "no article"], c: 1 },
        { q: "50. 'Do or Die' is a -", a: ["Simple Sentence", "Complex Sentence", "Compound Sentence", "Optative"], c: 2 }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const currentQ = quizData[currentIdx];
        document.getElementById("current-idx").innerText = currentIdx + 1;
        document.getElementById("question-text").innerText = currentQ.q;
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        document.getElementById("next-btn").style.display = "none";

        currentQ.a.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.classList.add("option-btn");
            btn.onclick = () => check(i, btn);
            container.appendChild(btn);
        });
    }

    function check(idx, btn) {
        if (answered) return;
        answered = true;
        const correct = quizData[currentIdx].c;
        const btns = document.querySelectorAll(".option-btn");

        if (idx === correct) {
            btn.classList.add("correct");
            score++;
            document.getElementById("score").innerText = score;
        } else {
            btn.classList.add("wrong");
            btns[correct].classList.add("correct");
        }
        document.getElementById("next-btn").style.display = "block";
    }

    function loadNextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            document.getElementById("quiz-content").style.display = "none";
            document.getElementById("result-area").style.display = "block";
            document.getElementById("final-score").innerText = score;
        }
    }

    loadQuestion();
</script>

</body>
</html>
